name: Verify CronFold
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Calendar and MCP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test and package
        shell: bash
        run: ./gradlew test installDist distZip --no-daemon --console=plain
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check mcp==1.26.0 tzdata==2025.2
      - name: Validate clock transitions against Python zoneinfo
        run: python checks/zoneinfo_smoke.py --install-dir build/install/cronfold
      - name: Import Kubernetes export and reproduce schedule reports
        shell: bash
        run: |
          cli=build/install/cronfold/bin/cronfold
          "$cli" import-kube --input examples/kubernetes/warehouse.json --duration 10 --controller-zone UTC --out build/imported
          "$cli" compare --before build/imported/plan.json --after build/imported/plan.json --from 2026-11-01T04:00:00Z --until 2026-11-01T09:00:00Z --out build/pass
          "$cli" demo --out build/warehouse
      - name: Read all verdicts with the official MCP client
        shell: bash
        run: |
          for report in build/pass/report.json build/warehouse/conflict/report.json build/warehouse/fixed/report.json; do
            python checks/mcp_smoke.py --install-dir build/install/cronfold --report "$report"
          done
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: |
            build/test-results/test/*.xml
            build/warehouse/*/report.*
